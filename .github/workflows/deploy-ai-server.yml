# Deploys Readily's AI and payment server (Supabase Edge Functions).
# Runs by itself when the server code changes, or from Actions > "Deploy AI server" > Run workflow.
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF.
name: Deploy AI server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SITE_URL: ${{ vars.SITE_URL || 'https://readily-3zay.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: |
          supabase functions deploy ai --project-ref "$PROJECT_REF"
          supabase functions deploy billing --project-ref "$PROJECT_REF"
          supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Tell the server where the website is
        run: supabase secrets set --project-ref "$PROJECT_REF" SITE_URL="$SITE_URL" ALLOWED_ORIGINS="$SITE_URL"
