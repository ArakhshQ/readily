# One-click Paddle setup: creates Basic, Pro and Premium (monthly and yearly) in Paddle,
# the webhook that tells Readily about payments, and saves the keys on the AI server.
# Run from Actions > "Set up Paddle" > Run workflow. Safe to run again.
# Needs repository secrets: PADDLE_API_KEY, SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
name: Set up Paddle

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SITE_URL: ${{ vars.SITE_URL || 'https://readilytools.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        run: |
          if [ -z "$PADDLE_API_KEY" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Add PADDLE_API_KEY, SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create plans, prices and webhook in Paddle
        run: node scripts/paddle-setup.mjs "https://$PROJECT_REF.supabase.co" "$SITE_URL" --save-to paddle.env
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Save the Paddle keys on the AI server
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" --yes --env-file paddle.env
          rm paddle.env
