# One-click Stripe setup: creates Basic, Pro and Premium (monthly and yearly), the
# webhook and the customer portal, and saves the keys on the AI server.
# Run from Actions > "Set up Stripe" > Run workflow. Safe to run again.
# Needs repository secrets: STRIPE_SECRET_KEY, SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
name: Set up Stripe

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SITE_URL: ${{ vars.SITE_URL || 'https://readily-3zay.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Add STRIPE_SECRET_KEY, SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create products, prices, webhook and portal
        run: node scripts/stripe-setup.mjs "https://$PROJECT_REF.supabase.co" "$SITE_URL" --save-to stripe.env
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Save the Stripe keys on the AI server
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" --yes --env-file stripe.env
          rm stripe.env
