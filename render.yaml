# Render Blueprint: deploys Readily as a free static site.
# In Render: New > Blueprint, pick this repo, and it sets everything up.
services:
  - type: web
    name: readily
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://readilytools.com
      # Accounts: see docs/ACCOUNTS-SETUP.md. Leave empty to run without accounts.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # Set to "true" once Paddle is set up (docs/PADDLE.md). Until then paid plans collect a waitlist.
      - key: NEXT_PUBLIC_PAYMENTS_ENABLED
        sync: false
      # Paddle's public client-side token (starts with live_). Not a secret.
      - key: NEXT_PUBLIC_PADDLE_CLIENT_TOKEN
        sync: false
      # The business behind Readily, shown on the Impressum, terms and privacy pages.
      # Address lines are separated with semicolons, e.g. "Musterstr. 1; 10115 Berlin; Germany".
      - key: NEXT_PUBLIC_BUSINESS_NAME
        sync: false
      - key: NEXT_PUBLIC_BUSINESS_ADDRESS
        sync: false
      # Optional: shown on the contact, privacy and terms pages.
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(self "https://buy.paddle.com" "https://sandbox-buy.paddle.com")
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /workers/*
        name: Cache-Control
        value: public, max-age=86400
